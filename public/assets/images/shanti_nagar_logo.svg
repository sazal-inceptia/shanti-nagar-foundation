<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <!-- Soft, warm transparent background or just clear -->
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Charity / Peace Icon (Abstract Hands/Heart/Leaf) -->
  <g transform="translate(20, 25)" filter="url(#shadow)">
    <!-- Heart left side (Orange) -->
    <path d="M 25,50 C 5,-20 40,-10 50,20 C 50,20 50,20 50,20 C 60,-10 95,-20 75,50 C 65,70 50,90 50,90 C 50,90 35,70 25,50 Z" 
          fill="none" stroke="#FF7A00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Leaf/Hand (Teal) -->
    <path d="M 50,90 C 70,80 90,50 80,30 C 70,10 40,20 50,50" 
          fill="none" stroke="#00A896" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="130" y="55" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="#2C3E50" letter-spacing="-0.5">Shanti Nagar</text>
  <text x="132" y="80" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="18" fill="#FF7A00" letter-spacing="3">FOUNDATION</text>
</svg>
